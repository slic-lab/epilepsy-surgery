*,

*::after {

}

}

body::before {
    position: fixed;

    z-index: 0;
    pointer-events: none;
    content: "";
    opacity: 0.42;
    background-image:
        linear-gradient(

        linear-gradient(

            rgba(78, 92, 160, 0.035) 1px,
            transparent 1px
        );

    -webkit-mask-image: linear-gradient(
        to bottom,
        black,
        transparent 80%

    mask-image: linear-gradient(
        to bottom,
        black,
        transparent 80%
    );
}

.page-shell {
    position: relative;
    z-index: 1;
    width: min(calc(100% - 2rem), 1600px);
    margin: 0 auto;
    padding: 2rem 0;
}

.sankey-panel {
    position: relative;
    overflow: visible;
    border: 0;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
    backdrop-filter: none;

}

.sankey-panel::before {

}

.plot-container {
    position: relative;
    z-index: 1;
    width: 100%;
}

.plot-container .plotly-graph-div {

}
