:root {

*,
*::before,
*::after {

}

html {

}

body {

    text-rendering: optimizeLegibility;
}

body::before {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    content: "";
    opacity: 0.42;
    background-image:
        linear-gradient(
            rgba(78, 92, 160, 0.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(78, 92, 160, 0.035) 1px,
            transparent 1px
        );
    background-size: 36px 36px;
    -webkit-mask-image: linear-gradient(
        to bottom,
        black,
        transparent 80%
    );
    mask-image: linear-gradient(
        to bottom,
        black,
        transparent 80%
    );
}

.page-shell {
    position: relative;
    z-index: 1;
    width: min(calc(100% - 2rem), 1600px);
    margin: 0 auto;
    padding: 2rem 0;
}

.sankey-panel {
    position: relative;
    overflow: visible;
    border: 0;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
}

.sankey-panel::before {
    display: none;
}

.plot-container {
    position: relative;
    z-index: 1;
    width: 100%;
}

.plot-container .plotly-graph-div {
    width: 100% !important;
}

@media (max-width: 760px) {

        padding: 0.5rem 0;
    }

    .sankey-panel {

}
