<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f8ff">
    <title>Questionnaire bilingue — Démonstration</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --background: #f6f8ff;
            --surface: rgba(255, 255, 255, 0.92);
            --text: #19223c;
            --muted: #67708a;
            --primary: #596be2;
            --primary-dark: #4051c2;
            --teal: #138d95;
            --danger: #b44747;
            --border: rgba(84, 100, 158, 0.18);
            --shadow: 0 28px 80px rgba(55, 67, 113, 0.15);
            --radius-large: 30px;
            --radius-medium: 20px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            background:
                radial-gradient(circle at 10% 8%, rgba(105, 88, 222, 0.16), transparent 28rem),
                radial-gradient(circle at 90% 10%, rgba(35, 180, 173, 0.14), transparent 25rem),
                var(--background);
            font-family: "Quicksand", sans-serif;
            line-height: 1.6;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        .shell {
            width: min(calc(100% - 1.25rem), 980px);
            margin: 0 auto;
            padding: 1.25rem 0 3rem;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-weight: 700;
        }

        .brand-mark {
            display: grid;
            width: 2.8rem;
            height: 2.8rem;
            place-items: center;
            border-radius: 0.95rem;
            color: white;
            background: linear-gradient(145deg, #7886ff, #4a58cc);
            box-shadow: 0 12px 28px rgba(74, 88, 204, 0.27);
        }

        .brand small {
            display: block;
            color: var(--muted);
            font-size: 0.72rem;
            letter-spacing: 0.07em;
            text-transform: uppercase;
        }

        .language-switch {
            display: inline-flex;
            gap: 0.3rem;
            padding: 0.3rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.8);
        }

        .language-button {
            padding: 0.55rem 0.9rem;
            border: 0;
            border-radius: 999px;
            color: var(--muted);
            background: transparent;
            font-weight: 700;
            cursor: pointer;
        }

        .language-button.active {
            color: white;
            background: var(--primary);
            box-shadow: 0 8px 18px rgba(89, 107, 226, 0.24);
        }

        .card {
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-radius: var(--radius-large);
            background: var(--surface);
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow);
        }

        .hero {
            padding: clamp(1.6rem, 5vw, 3rem);
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, #ffffff, rgba(244, 247, 255, 0.82));
        }

        .eyebrow {
            margin: 0 0 0.6rem;
            color: var(--primary-dark);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 6vw, 4rem);
            line-height: 1.05;
            letter-spacing: -0.05em;
        }

        .hero-description {
            max-width: 760px;
            margin: 1rem 0 0;
            color: var(--muted);
            font-weight: 500;
        }

        .notice {
            margin: 1rem clamp(1rem, 4vw, 2rem) 0;
            padding: 1rem 1.1rem;
            border: 1px solid rgba(180, 71, 71, 0.2);
            border-radius: 14px;
            color: #743838;
            background: #fff6f6;
            font-weight: 600;
        }

        .progress-wrap {
            padding: 1.5rem clamp(1rem, 4vw, 2rem) 0;
        }

        .progress-meta {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.55rem;
            color: var(--muted);
            font-size: 0.85rem;
            font-weight: 700;
        }

        .progress-track {
            height: 0.8rem;
            overflow: hidden;
            border-radius: 999px;
            background: #e8ebf7;
        }

        .progress-bar {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--primary), var(--teal));
            transition: width 220ms ease;
        }

        form {
            padding: clamp(1rem, 4vw, 2rem);
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
            animation: appear 220ms ease both;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-header {
            margin-bottom: 1.25rem;
        }

        .page-header h2 {
            margin: 0;
            font-size: clamp(1.45rem, 4vw, 2.2rem);
            letter-spacing: -0.03em;
        }

        .page-header p {
            margin: 0.35rem 0 0;
            color: var(--muted);
        }

        .question {
            margin-bottom: 1rem;
            padding: 1.25rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-medium);
            background: rgba(255, 255, 255, 0.8);
        }

        .question.hidden {
            display: none;
        }

        .question-title {
            display: block;
            margin-bottom: 0.75rem;
            font-weight: 700;
        }

        .required {
            color: var(--danger);
        }

        .options {
            display: grid;
            gap: 0.65rem;
        }

        .option {
            display: flex;
            align-items: flex-start;
            gap: 0.7rem;
            padding: 0.8rem 0.9rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: white;
            cursor: pointer;
        }

        .option:hover {
            border-color: rgba(89, 107, 226, 0.45);
            box-shadow: 0 8px 20px rgba(70, 82, 135, 0.08);
        }

        .option input {
            margin-top: 0.25rem;
            accent-color: var(--primary);
        }

        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 0.85rem 0.95rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            background: white;
            outline: none;
        }

        textarea {
            min-height: 115px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(89, 107, 226, 0.12);
        }

        .error {
            display: none;
            margin: 0.6rem 0 0;
            color: var(--danger);
            font-size: 0.84rem;
            font-weight: 700;
        }

        .question.invalid {
            border-color: rgba(180, 71, 71, 0.52);
            background: #fffafa;
        }

        .question.invalid .error {
            display: block;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            gap: 0.8rem;
            margin-top: 1.6rem;
        }

        .button {
            min-height: 3rem;
            padding: 0.75rem 1.2rem;
            border: 0;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
        }

        .button-secondary {
            color: var(--text);
            background: #edf0f8;
        }

        .button-primary {
            color: white;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            box-shadow: 0 12px 25px rgba(64, 81, 194, 0.24);
        }

        .button[disabled] {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .completion {
            display: none;
            padding: 3rem 1.5rem;
            text-align: center;
        }

        .completion.active {
            display: block;
        }

        .completion-icon {
            display: grid;
            width: 4.5rem;
            height: 4.5rem;
            margin: 0 auto 1rem;
            place-items: center;
            border-radius: 50%;
            color: white;
            background: linear-gradient(145deg, var(--teal), var(--primary));
            font-size: 2rem;
        }

        .completion h2 {
            margin: 0;
            font-size: 2rem;
        }

        .completion p {
            max-width: 650px;
            margin: 0.8rem auto 1.4rem;
            color: var(--muted);
        }

        .footer {
            padding-top: 1rem;
            color: var(--muted);
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
        }

        @media (max-width: 680px) {
            .topbar {
                align-items: flex-start;
            }

            .brand small {
                display: none;
            }

            .question {
                padding: 1rem;
            }

            .actions {
                flex-direction: column-reverse;
            }

            .button {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <div class="brand">
                <span>
                    <span data-ui="brand"></span>
                    <small data-ui="mock"></small>
                </span>
            </div>

            <div class="language-switch" aria-label="Language">
                <button class="language-button active" type="button" data-language="fr">
                    Français
                </button>
                <button class="language-button" type="button" data-language="en">
                    English
                </button>
            </div>
        </header>

        <main class="card">
            <section class="hero">
                <p class="eyebrow" data-ui="eyebrow"></p>
                <h1 data-ui="title"></h1>
                <p class="hero-description" data-ui="description"></p>
            </section>

            <div class="notice" role="note" data-ui="notice"></div>

            <div class="progress-wrap" id="progressWrap">
                <div class="progress-meta">
                    <span id="stepLabel"></span>
                    <span id="progressPercent">0 %</span>
                </div>
                <div class="progress-track" aria-hidden="true">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>

            <form id="survey" novalidate>
                <div id="pages"></div>

                <div class="actions">
                    <button
                        class="button button-secondary"
                        type="button"
                        id="previousButton"
                    ></button>
                    <button
                        class="button button-primary"
                        type="button"
                        id="nextButton"
                    ></button>
                </div>
            </form>

            <section class="completion" id="completion" aria-live="polite">
                <div class="completion-icon" aria-hidden="true">✓</div>
                <h2 data-ui="completeTitle"></h2>
                <p data-ui="completeText"></p>
                <button
                    class="button button-primary"
                    type="button"
                    id="restartButton"
                    data-ui="restart"
                ></button>
            </section>
        </main>

        <footer class="footer" data-ui="footer"></footer>
    </div>

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function localized(value) {
            return value?.[language] || value?.fr || value?.en || "";
        }

        function renderField(field) {
            const required = field.required
                ? '<span class="required" aria-label="required">*</span>'
                : "";

            let control = "";

            if (field.type === "radio" || field.type === "checkbox") {
                control = `
                    <div class="options">
                        ${field.choices.map(choice => `
                            <label class="option">
                                <input
                                    type="${field.type}"
                                    name="${escapeHtml(field.name)}"
                                    value="${escapeHtml(choice.value)}"
                                >
                                <span>${escapeHtml(localized(choice))}</span>
                            </label>
                        `).join("")}
                    </div>
                `;
            } else {
                const longText = /comment|préciser|pourquoi|impact|autre|explain|describe|specify/i
                    .test(localized(field.label));
                const inputType = field.validation.includes("integer")
                    ? "number"
                    : "text";

                control = longText
                    ? `<textarea name="${escapeHtml(field.name)}" autocomplete="off"></textarea>`
                    : `<input type="${inputType}" name="${escapeHtml(field.name)}" autocomplete="off">`;
            }

            return `
                <section
                    class="question"
                    data-field="${escapeHtml(field.name)}"
                    data-branching="${escapeHtml(field.branching)}"
                    data-required="${field.required ? "true" : "false"}"

                        ${escapeHtml(localized(field.label))} ${required}

                    ${control}
                    <p class="error">${escapeHtml(ui[language].required)}</p>
                </section>
            `;
        }

        function renderPages() {
            pagesContainer.innerHTML = "";

            data.sections.forEach((section, index) => {
                const sectionFields = data.fields.filter(

                    return;

                const page = document.createElement("section");
                page.className = `page${index === currentPage ? " active" : ""}`;
                page.dataset.section = section.id;
                page.innerHTML = `

        function getValue(fieldName) {
            const controls = [
                ...form.querySelectorAll(
                    `[name="${CSS.escape(fieldName)}"]`
                )
            ];

            if (!controls.length) {
                return null;
            }

            if (controls[0].type === "checkbox") {
                return controls
                    .filter(control => control.checked)
                    .map(control => control.value);
            }

            if (controls[0].type === "radio") {
                const selected = controls.find(control => control.checked);
                return selected ? selected.value : null;
            }

            return controls[0].value.trim();
        }

        function evaluateCondition(condition) {
            let expression = condition;

            expression = expression.replace(
                /\[([A-Za-z0-9_]+)\(([^)]+)\)\]\s*=\s*'([^']+)'/g,
                (_, fieldName, choice, expected) => {
                    const value = getValue(fieldName);
                    const matches =
                        Array.isArray(value) &&
                        value.includes(choice) === (expected === "1");
                    return String(matches);
                }
            );

            expression = expression.replace(
                /\[([A-Za-z0-9_]+)\]\s*(=|<>|!=)\s*'([^']*)'/g,
                (_, fieldName, operator, expected) => {
                    const value = getValue(fieldName);
                    const actual = value === null ? "" : String(value);
                    const matches =
                        operator === "="
                            ? actual === expected
                            : actual !== expected;
                    return String(matches);
                }
            );

            expression = expression
                .replace(/\bAND\b/gi, "&&")
                .replace(/\bOR\b/gi, "||");

            if (!/^[\s()!&|truefals]+$/.test(expression)) {
                return true;
            }

            try {
                return Function(
                    `"use strict"; return (${expression});`
                )();
            } catch {
                return true;
            }
        }

        function updateBranching() {
            document.querySelectorAll(".question").forEach(question => {
                const logic = question.dataset.branching;
                const visible = !logic || evaluateCondition(logic);

                question.classList.toggle("hidden", !visible);
                question.classList.remove("invalid");

                if (!visible) {
                    question
                        .querySelectorAll("input, textarea, select")
                        .forEach(control => {
                            if (
                                control.type === "radio" ||
                                control.type === "checkbox"
                            ) {
                                control.checked = false;
                            } else {
                                control.value = "";
                            }
                        });
                }
            });

                    if (question.dataset.required !== "true") {
                        return;

                    const controls = [
                        ...question.querySelectorAll(

                    const answered = controls.some(control => {
                        if (
                            control.type === "radio" ||
                            control.type === "checkbox"

                            return control.checked;
                        }
                        return control.value.trim() !== "";

                    if (!answered) {
                        valid = false;
                        question.classList.add("invalid");
                    }
                });

            const firstInvalid = current.querySelector(".question.invalid");
            if (firstInvalid) {
                firstInvalid.scrollIntoView({
                    behavior: "smooth",
                    block: "center"

            return valid;

                    ? "Questionnaire bilingue — Démonstration"
                    : "Bilingual questionnaire — Demonstration";

            document.querySelectorAll("[data-ui]").forEach(element => {
                const key = element.dataset.ui;
                element.textContent = ui[language][key];
            });

            document.querySelectorAll(".language-button").forEach(button => {
                button.classList.toggle(
                    "active",
                    button.dataset.language === language
                );
            });

            renderPages();
            updateNavigation();
        }

        function updateNavigation() {
            const pages = [...document.querySelectorAll(".page")];

            pages.forEach((page, index) => {
                page.classList.toggle("active", index === currentPage);
            });

            previousButton.disabled = currentPage === 0;
            previousButton.textContent = ui[language].previous;
            nextButton.textContent =
                currentPage === pages.length - 1
                    ? ui[language].finish
                    : ui[language].next;

            const percentage = Math.round(
                ((currentPage + 1) / pages.length) * 100
            );

            progressBar.style.width = `${percentage}%`;
            progressPercent.textContent = `${percentage} %`;
            stepLabel.textContent = ui[language].step(
                currentPage + 1,
                pages.length
            );
        }

        document.querySelectorAll(".language-button").forEach(button => {
            button.addEventListener("click", () => {
                if (button.dataset.language === language) {
                    return;
                }

                const savedValues = {};
                data.fields.forEach(field => {
                    savedValues[field.name] = getValue(field.name);
                });

                language = button.dataset.language;
                updateInterface();

                Object.entries(savedValues).forEach(([name, value]) => {
                    const controls = [
                        ...form.querySelectorAll(
                            `[name="${CSS.escape(name)}"]`
                        )
                    ];

                    if (Array.isArray(value)) {
                        controls.forEach(control => {
                            control.checked = value.includes(control.value);
                        });
                    } else if (controls[0]?.type === "radio") {
                        controls.forEach(control => {
                            control.checked = control.value === value;
                        });
                    } else if (controls[0] && value !== null) {
                        controls[0].value = value;
                    }
                });

                updateBranching();
            });
        });

        form.addEventListener("change", updateBranching);

        form.addEventListener("input", event => {
            event.target
                .closest(".question")
                ?.classList.remove("invalid");
            updateBranching();
        });

        nextButton.addEventListener("click", () => {
            if (!validateCurrentPage()) {
                return;
            }

            const pages = [...document.querySelectorAll(".page")];

            if (currentPage < pages.length - 1) {
                currentPage += 1;
                updateNavigation();
                updateBranching();
                window.scrollTo({ top: 0, behavior: "smooth" });
                return;
            }

            form.style.display = "none";
            progressWrap.style.display = "none";
            completion.classList.add("active");
            completion.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        });

        previousButton.addEventListener("click", () => {
            if (currentPage === 0) {
                return;
            }

            currentPage -= 1;
            updateNavigation();
            updateBranching();
            window.scrollTo({ top: 0, behavior: "smooth" });
        });

        restartButton.addEventListener("click", () => {
            form.reset();
            currentPage = 0;
            completion.classList.remove("active");
            form.style.display = "block";
            progressWrap.style.display = "block";
            updateInterface();
            window.scrollTo({ top: 0, behavior: "smooth" });
        });

        updateInterface();
    </script>
</body>
</html>
